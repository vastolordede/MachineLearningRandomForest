[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlrf-used-car-price"
version = "0.1.0"
description = "Used-car price regression study: custom random forest over sklearn decision trees"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=17,<25",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
